[pytest]
testpaths = tests
addopts = -m "not requires_gl and not requires_audio and not requires_libpd and not requires_serial"
markers =
    requires_libpd: needs the real libs/libpd.dll
    requires_audio: needs a real audio device (PortAudio)
    requires_gl: needs an OpenGL 3.3 context / display
    requires_serial: needs a real serial port
    e2e: end-to-end project run through the CLI
filterwarnings =
    error::DeprecationWarning:crude.*
